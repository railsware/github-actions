name: Resolve pending release
description: >
  Read the newest version from the top "## [X.Y.Z]" heading of the changelog and report whether
  it is still unreleased, i.e. has no published GitHub Release yet. Works with a read-only token;
  the publish job confirms the draft. Does not fail when nothing is pending.
inputs:
  changelog:
    required: false
    default: CHANGELOG.md
    description: "Path to the changelog written by prepend-changelog"
  tag-prefix:
    required: false
    default: v
    description: "Prefix of the release tag before the version (empty for bare X.Y.Z tags)"
  repo:
    required: false
    default: ${{ github.repository }}
    description: "owner/name of the repository hosting the release"
  github-token:
    required: false
    default: ${{ github.token }}
    description: "Token with read access to the repository's releases"
outputs:
  version:
    description: "Newest changelog version (X.Y.Z)"
    value: ${{ steps.resolve.outputs.version }}
  tag:
    description: "Release tag (tag-prefix + version)"
    value: ${{ steps.resolve.outputs.tag }}
  pending:
    description: "'true' while the tag has no published GitHub Release, 'false' once it is released"
    value: ${{ steps.resolve.outputs.pending }}
runs:
  using: composite
  steps:
    - id: resolve
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        CHANGELOG: ${{ inputs.changelog }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        REPO: ${{ inputs.repo }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const changelog = process.env.CHANGELOG;
          const [owner, repo] = process.env.REPO.split('/');

          // Only version headings count, so a hand-added "## [Unreleased]" is skipped.
          const match = fs.readFileSync(changelog, 'utf8').match(/^## \[(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\]/m);
          if (!match) {
            core.setFailed(`No '## [X.Y.Z]' heading found in ${changelog}`);
            return;
          }
          const version = match[1];
          const tag = `${process.env.TAG_PREFIX}${version}`;

          // Drafts are listed only to tokens with push access, so a read-only token can't tell a
          // draft from no release at all. A published release is visible to any token (and
          // getReleaseByTag returns only published ones), so the newest changelog version counts
          // as pending until it is released. The publish job checks the draft with a write token.
          let released = true;
          try {
            await github.rest.repos.getReleaseByTag({ owner, repo, tag });
          } catch (err) {
            if (err.status !== 404) throw err;
            released = false;
          }

          core.info(`Newest changelog version ${version}, GitHub Release ${tag}: ${released ? 'released' : 'not released yet'}`);
          core.setOutput('version', version);
          core.setOutput('tag', tag);
          core.setOutput('pending', String(!released));

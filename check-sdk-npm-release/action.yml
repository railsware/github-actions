name: Check SDK npm release
description: Fail the job if the package version is already published to npm.
inputs:
  package:
    required: true
    description: "npm package name"
  version:
    required: true
    description: "Version to check (X.Y.Z)"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
      run: |
        if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
          echo "::error::$PACKAGE@$VERSION is already published to npm"
          exit 1
        fi
